# FSD Cannonball data relay.
#
# fsddb.com serves no CORS headers and the public CORS mirrors
# (allorigins, codetabs) proved unreliable under race-day load, so the
# browser can't dependably read the tracker cross-origin. This workflow
# keeps a pruned snapshot (~2 KB, single-commit branch `cannonball-data`)
# fresh; js/cannonball.js reads it via raw.githubusercontent.com, which
# does send Access-Control-Allow-Origin.
#
# Freshness: cron fires every 5 minutes (GitHub's minimum) and each run
# LOOPS for ~4.5 minutes, polling fsddb every ~45 s and pushing only
# when the data changed — so the relay lags fsddb by ~1 minute even
# when the cron scheduler jitters. Volatile fields the board never
# reads (live_location, route polylines, server_now) are pruned so
# "changed" means the counters moved, not the GPS dot.
#
# Self-quiescing: when the snapshot stops changing (run over), nothing
# is pushed. Safe to delete this workflow + the cannonball-data branch
# once the run is history.
name: cannonball-relay
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ['main', 'claude/fsd-cannonball-time-calc-iyshs7']
    paths: ['.github/workflows/cannonball-relay.yml']

permissions:
  contents: write

concurrency:
  group: cannonball-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Poll snapshot and publish changes to cannonball-data
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          import json, os, re, subprocess, time, urllib.request

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          DEADLINE = time.time() + 265   # ~4.5 min; next cron covers the rest
          POLL_S = 45

          def get(url, accept=None):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': accept or '*/*'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read()

          def prune(o):
              if isinstance(o, dict):
                  return {k: prune(v) for k, v in o.items()
                          if k not in ('route_line', 'public_trip_paths', 'live_location', 'server_now')}
              if isinstance(o, list):
                  return [prune(x) for x in o]
              return o

          def publish(body):
              subprocess.run(['rm', '-rf', '/tmp/relay'], check=True)
              os.makedirs('/tmp/relay')
              os.chdir('/tmp/relay')
              open('cannonball.json', 'w').write(body)
              for a in (['git', 'init', '-q', '-b', 'cannonball-data'],
                        ['git', 'config', 'user.name', 'cannonball-relay'],
                        ['git', 'config', 'user.email', 'actions@users.noreply.github.com'],
                        ['git', 'add', 'cannonball.json'],
                        ['git', 'commit', '-q', '-m', 'cannonball snapshot'],
                        ['git', 'push', '-q', '--force',
                         'https://x-access-token:%s@github.com/%s.git' % (os.environ['GH_TOKEN'], os.environ['REPO']),
                         'cannonball-data']):
                  subprocess.run(a, check=True)

          # The snapshot ?client= token rotates per race — read the current
          # one off the tracker page once per run.
          path = '/trackers/fsdcannonball/snapshot'
          try:
              page = get('https://fsddb.com/trackers/FSDCannonball').decode('utf-8', 'replace')
              m = re.search(r'data-snapshot-url="(/trackers/[^"]+)"', page)
              if m:
                  path = m.group(1)
          except Exception as e:
              print('page fetch failed, using default snapshot path:', e)

          last = None
          try:
              last = get('https://raw.githubusercontent.com/%s/cannonball-data/cannonball.json?_=%d'
                         % (os.environ['REPO'], time.time())).decode()
          except Exception:
              pass

          pushes = 0
          while True:
              try:
                  data = json.loads(get('https://fsddb.com' + path, 'application/json'))
                  if 'race' in data or 'public_route' in data:
                      body = json.dumps(prune(data), sort_keys=True, separators=(',', ':')) + '\n'
                      if body != last:
                          publish(body)
                          last = body
                          pushes += 1
                          print('pushed update; progress_miles =',
                                (data.get('public_route') or {}).get('progress_miles'))
                  else:
                      print('snapshot answered an error, keeping previous data:', data)
              except Exception as e:
                  print('poll failed:', e)
              if time.time() + POLL_S > DEADLINE:
                  break
              time.sleep(POLL_S)
          print('run done,', pushes, 'push(es)')
