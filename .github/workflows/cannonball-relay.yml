# FSD Cannonball data relay.
#
# fsddb.com serves no CORS headers and the public CORS mirrors
# (allorigins, codetabs) proved unreliable under race-day load, so the
# browser can't dependably read the tracker cross-origin. This workflow
# keeps a pruned snapshot (~2 KB, single-commit branch `cannonball-data`)
# fresh; js/cannonball.js reads it via raw.githubusercontent.com, which
# does send Access-Control-Allow-Origin.
#
# Freshness: NEVER rely on cron cadence. GitHub throttles scheduled
# workflows hard on public repos. Measured here: a '*/5' cron fired
# roughly hourly all afternoon, then went silent for 44 min, then for
# 141 min — so even 55-minute polling runs left multi-hour holes.
#
# So each run CHAINS THE NEXT ONE ITSELF: it polls for ~50 minutes and
# then re-dispatches this workflow through the REST API. workflow_dispatch
# (and repository_dispatch) are the documented exceptions to GitHub's
# "GITHUB_TOKEN events don't trigger workflows" rule, so this is a
# supported way to self-schedule. The cron stays only as a backstop that
# restarts the chain if a run dies before dispatching; the chain step
# runs with if:always() so even a crashed poll still hands off.
#
# The concurrency group keeps exactly one run live with one queued
# behind it. Volatile fields the board never reads (live_location, route
# polylines, server_now) are pruned so "changed" means the counters
# moved, not the GPS dot.
#
# Self-terminating: the chain stops once fsddb marks the run ended (or a
# hard safety cutoff of 5 days past the start), so it can't spin forever.
# Safe to delete this workflow + the cannonball-data branch once the run
# is history.
name: cannonball-relay
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ['main', 'claude/fsd-cannonball-time-calc-iyshs7']
    paths: ['.github/workflows/cannonball-relay.yml']

permissions:
  contents: write
  actions: write        # required to re-dispatch this workflow

concurrency:
  group: cannonball-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Poll snapshot and publish changes to cannonball-data
        id: poll
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          import datetime, json, os, re, subprocess, time, urllib.request

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          DEADLINE = time.time() + 3000  # ~50 min, then hand off to the next run
          POLL_S = 45
          TOKEN_REFRESH_S = 900          # re-read the ?client= token periodically
          SAFETY_DAYS = 5                # hard stop so the chain can't spin forever

          def get(url, accept=None):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': accept or '*/*'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read()

          def prune(o):
              if isinstance(o, dict):
                  return {k: prune(v) for k, v in o.items()
                          if k not in ('route_line', 'public_trip_paths', 'live_location', 'server_now')}
              if isinstance(o, list):
                  return [prune(x) for x in o]
              return o

          def publish(body):
              # Step out of the work dir before deleting it — a run now
              # publishes many times, and rm'ing the cwd breaks the next
              # subprocess fork.
              os.chdir('/tmp')
              subprocess.run(['rm', '-rf', '/tmp/relay'], check=True)
              os.makedirs('/tmp/relay')
              os.chdir('/tmp/relay')
              open('cannonball.json', 'w').write(body)
              for a in (['git', 'init', '-q', '-b', 'cannonball-data'],
                        ['git', 'config', 'user.name', 'cannonball-relay'],
                        ['git', 'config', 'user.email', 'actions@users.noreply.github.com'],
                        ['git', 'add', 'cannonball.json'],
                        ['git', 'commit', '-q', '-m', 'cannonball snapshot'],
                        ['git', 'push', '-q', '--force',
                         'https://x-access-token:%s@github.com/%s.git' % (os.environ['GH_TOKEN'], os.environ['REPO']),
                         'cannonball-data']):
                  subprocess.run(a, check=True)

          # The snapshot ?client= token rotates per race — re-read it off
          # the tracker page periodically, since a run now spans ~55 min.
          path = '/trackers/fsdcannonball/snapshot'
          token_read_at = 0.0

          def refresh_token():
              global path, token_read_at
              try:
                  page = get('https://fsddb.com/trackers/FSDCannonball').decode('utf-8', 'replace')
                  m = re.search(r'data-snapshot-url="(/trackers/[^"]+)"', page)
                  if m and m.group(1) != path:
                      print('snapshot path ->', m.group(1))
                      path = m.group(1)
                  token_read_at = time.time()
              except Exception as e:
                  print('page fetch failed, keeping snapshot path %r: %s' % (path, e))

          refresh_token()

          last = None
          try:
              last = get('https://raw.githubusercontent.com/%s/cannonball-data/cannonball.json?_=%d'
                         % (os.environ['REPO'], time.time())).decode()
          except Exception:
              pass

          def race_over(data):
              """True once fsddb calls it, or past the safety cutoff."""
              race = data.get('race') or {}
              if data.get('ended_at') or race.get('ended_at') or race.get('final_seconds'):
                  return 'fsddb marked the run ended'
              if (data.get('status') or 'active').lower() not in ('active', 'scheduled'):
                  return 'status = %s' % data.get('status')
              started = race.get('started_at') or data.get('started_at')
              if started:
                  try:
                      age = time.time() - datetime.datetime.fromisoformat(started).timestamp()
                      if age > SAFETY_DAYS * 86400:
                          return 'safety cutoff: %.1f days since start' % (age / 86400)
                  except Exception:
                      pass
              return None

          stop_reason = None
          pushes = 0
          while True:
              if time.time() - token_read_at > TOKEN_REFRESH_S:
                  refresh_token()
              try:
                  data = json.loads(get('https://fsddb.com' + path, 'application/json'))
                  if 'race' in data or 'public_route' in data:
                      body = json.dumps(prune(data), sort_keys=True, separators=(',', ':')) + '\n'
                      if body != last:
                          publish(body)
                          last = body
                          pushes += 1
                          print('pushed update; progress_miles =',
                                (data.get('public_route') or {}).get('progress_miles'))
                      stop_reason = race_over(data)
                      if stop_reason:
                          print('stopping the relay chain:', stop_reason)
                          break
                  else:
                      print('snapshot answered an error, keeping previous data:', data)
              except Exception as e:
                  print('poll failed:', e)
              if time.time() + POLL_S > DEADLINE:
                  break
              time.sleep(POLL_S)

          print('run done,', pushes, 'push(es)')
          if stop_reason:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write('stop=1\n')

      # Hand off to the next run ourselves rather than trusting cron.
      # always() so a crashed/timed-out poll still chains; skipped only
      # when the poll proved the run is over.
      - name: Chain the next relay run
        if: always() && steps.poll.outputs.stop != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/cannonball-relay.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch HTTP $code"
          [ "$code" = "204" ] || { cat /tmp/dispatch.out; exit 1; }
