# TEMPORARY probe — dispatched from a Claude Code session to inspect
# the public fsddb.com tracker structure (the dev sandbox has no
# general internet egress). Deleted after use.
name: fsddb-probe
on:
  push:
    branches: ['claude/fsd-cannonball-time-calc-iyshs7']
    paths: ['.github/workflows/fsddb-probe.yml', '.probe-urls']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify mirror chain + capture fixture snapshot
        shell: python3 {0}
        run: |
          import json, re, urllib.request, urllib.parse

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'

          def get(url, headers=None):
              req = urllib.request.Request(url, headers=dict({'User-Agent': UA}, **(headers or {})))
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.status, dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()[:2000]
              except Exception as e:
                  return None, {}, str(e).encode()

          SNAP = 'https://fsddb.com/trackers/fsdcannonball/snapshot?client=20260724-race-1'
          PAGE = 'https://fsddb.com/trackers/FSDCannonball'
          ORIG = {'Origin': 'https://tesla-essentials.com'}

          def mirror(u):
              return 'https://api.allorigins.win/raw?url=' + urllib.parse.quote(u, safe='') + '&_=1234567890'

          # 1) allorigins page fetch (the workhorse source)
          st, h, b = get(mirror(PAGE), ORIG)
          html = b.decode('utf-8', 'replace')
          print('== MIRROR PAGE status', st, 'bytes', len(html),
                'has-snapshot:', 'let snapshot' in html,
                'has-snapshot-url:', 'data-snapshot-url' in html,
                'acao:', h.get('Access-Control-Allow-Origin'))

          # 2) allorigins snapshot WITH client token
          st, h, b = get(mirror(SNAP), ORIG)
          print('== MIRROR SNAPSHOT status', st, 'bytes', len(b), 'acao:', h.get('Access-Control-Allow-Origin'))
          try:
              keys = list(json.loads(b).keys())
              print('   top-level keys:', keys)
          except Exception as e:
              print('   body head:', b[:300])

          # 3) codetabs as a possible second mirror
          st, h, b = get('https://api.codetabs.com/v1/proxy?quest=' + urllib.parse.quote(SNAP, safe=''), ORIG)
          print('== CODETABS SNAPSHOT status', st, 'bytes', len(b), 'acao:', h.get('Access-Control-Allow-Origin'))
          print('   body head:', b[:200])

          # 4) fresh direct snapshot -> full fixture with route coords pruned
          st, h, b = get(SNAP, {'Accept': 'application/json'})
          data = json.loads(b)
          def prune(o):
              if isinstance(o, dict):
                  return {k: (dict(o[k], coordinates=o[k].get('coordinates', [])[:3]) if k == 'route_line' and isinstance(o[k], dict) else prune(o[k])) for k in o}
              if isinstance(o, list):
                  return [prune(x) for x in o]
              return o
          print('== FIXTURE-BEGIN')
          print(json.dumps(prune(data)))
          print('== FIXTURE-END')
