# TEMPORARY probe — dispatched from a Claude Code session to check the
# fsddb tracker + mirror health (the dev sandbox has no general internet
# egress). Deleted after use.
name: fsddb-probe
on:
  push:
    branches: ['claude/fsd-cannonball-time-calc-iyshs7']
    paths: ['.github/workflows/fsddb-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check run status + mirror health
        shell: python3 {0}
        run: |
          import json, urllib.request, urllib.parse, time

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'

          def get(url, headers=None, timeout=25):
              req = urllib.request.Request(url, headers=dict({'User-Agent': UA}, **(headers or {})))
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read(), time.time() - t0
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:500], time.time() - t0
              except Exception as e:
                  return None, str(e).encode(), time.time() - t0

          SNAP = 'https://fsddb.com/trackers/fsdcannonball/snapshot?client=20260724-race-1'

          st, b, dt = get(SNAP, {'Accept': 'application/json'})
          print('== DIRECT SNAPSHOT', st, '%.1fs' % dt)
          try:
              d = json.loads(b)
              keep = {k: d.get(k) for k in ('status', 'started_at', 'ended_at', 'total_miles',
                      'self_driving_miles', 'manual_miles', 'fsd_percentage', 'counter_updated_at', 'server_now')}
              keep['public_route'] = {k: v for k, v in (d.get('public_route') or {}).items()
                                      if k in ('planned_total_miles', 'progress_miles', 'progress_fraction')}
              keep['race'] = d.get('race')
              keep['approximate_location'] = d.get('approximate_location')
              print(json.dumps(keep, indent=1))
          except Exception:
              print('body:', b[:400])

          q = urllib.parse.quote(SNAP, safe='')
          for label, url in [
              ('ALLORIGINS', 'https://api.allorigins.win/raw?url=' + q + '&_=%d' % time.time()),
              ('CODETABS', 'https://api.codetabs.com/v1/proxy?quest=' + q),
          ]:
              st, b, dt = get(url, {'Origin': 'https://tesla-essentials.com'})
              ok = False
              try:
                  ok = 'race' in json.loads(b)
              except Exception:
                  pass
              print('== %s status %s in %.1fs, parses-with-race: %s, head: %r' % (label, st, dt, ok, b[:120]))
